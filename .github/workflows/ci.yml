name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for script in install.sh install-codex.sh uninstall.sh uninstall-codex.sh scripts/*.sh; do
            bash -n "$script"
          done
      - name: Build and test without showing overlays
        run: make test
